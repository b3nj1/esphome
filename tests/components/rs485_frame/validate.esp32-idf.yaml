## Config-only validation tests for validate_hub() branches and the button platform's
## _final_validate, which the compiled common.yaml does not all reach. CI runs this with
## `esphome config` only; it is never compiled, so it uses the shared UART package like the
## compiled tests.

packages:
  uart: !include ../../test_build_components/common/uart/esp32-idf.yaml

rs485_frame:
  # frame_trigger gate (default mode) with an explicit gate.frame_type + a command_format,
  # so the `command:`-form button below is accepted.
  - id: cmd_hub
    uart_id: uart_bus
    crc:
      type: sum16
      rx_accept: [header_inclusive, payload_only]
      tx_variant: header_inclusive
    tx:
      gate:
        frame_type: [0x01, 0x01]
    command_format:
      preamble: [0x00, 0x83, 0x01]
      command_size: 4
      command_repeat: 2
      postamble: [0x00]

  # Sniffer-only hub: exempt from the frame_trigger gate.frame_type requirement, and
  # exercises sniffer_stats: with no explicit reference_frame_type so the default-to-gate
  # fallback in to_code is reached during config-only validation. crc: type none.
  - id: sniffer_hub
    uart_id: uart_bus
    sniffer_only: true
    crc:
      type: none
    tx:
      gate:
        mode: idle_gap
    sniffer_stats: {}

  # Raw-only generic hub with custom (non-default) framing bytes — exercises the framing
  # distinctness validation passing, and is the target of the raw-form button below (no
  # command_format, so the `command:` form would be rejected against it).
  - id: raw_hub
    uart_id: uart_bus
    framing:
      dle: 0x7D
      stx: 0x01
      etx: 0x04
      escape_byte: 0x00
    crc:
      type: xor8
    tx:
      gate:
        mode: idle_gap

  # idle_command requires a command_format so the value has a defined encoding. fixed_delay
  # gate mode (no gate.frame_type needed).
  - id: idle_hub
    uart_id: uart_bus
    crc:
      type: sum8
    command_format:
      preamble: [0x00, 0x01, 0x80]
      command_size: 1
    tx:
      gate:
        mode: fixed_delay
        interval: 250ms
      idle_command: 0x00

# Buttons exercise both _final_validate branches:
#   - command-form against a hub that has a command_format (cmd_hub)  -> accepted
#   - raw form against a hub with no command_format (raw_hub)         -> accepted
button:
  - platform: rs485_frame
    rs485_frame_id: cmd_hub
    name: "Validate Command"
    command: 0x00010000

  - platform: rs485_frame
    rs485_frame_id: raw_hub
    name: "Validate Raw"
    frame_type: [0x00, 0xA1]
    payload: [0x01, 0x02, 0x03, 0x04]
