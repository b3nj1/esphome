## Config-only validation tests for profile UART enforcement and gate-frame defaults.
## These exercise validate_hub() + _final_validate() branches that the regular
## test.*.yaml configs (which use generic_rs485_frame) do not reach. CI runs this with
## `esphome config` only; it is never compiled.

uart:
  # Hayward profiles require 19200 8N2
  - id: hayward_uart
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 19200
    data_bits: 8
    parity: NONE
    stop_bits: 2

  # Jandy AquaLink RS requires 9600 8N1
  - id: jandy_uart
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

  # Generic UART with deliberately atypical settings — proves generic_rs485_frame
  # skips final_validate UART enforcement entirely.
  - id: generic_uart
    tx_pin: GPIO21
    rx_pin: GPIO22
    baud_rate: 38400
    data_bits: 7
    parity: EVEN
    stop_bits: 1

rs485_frame:
  # Hayward wireless — default key_format wireless_12byte, gate [0x01, 0x01].
  - id: hayward_wireless_hub
    uart_id: hayward_uart
    profile: hayward_aqualogic_wireless

  # Hayward wired remote — header_inclusive CRC, key_format wired_remote, sub-type 0x03.
  - id: hayward_wired_remote_hub
    uart_id: hayward_uart
    profile: hayward_aqualogic_wired_remote

  # Hayward wired local — header_inclusive CRC, key_format wired_local, sub-type 0x02.
  # Exercises the wired_sub_type override too: impersonate unit 3 (0x04) to avoid the
  # default-0x02 collision with main-panel keypress traffic.
  - id: hayward_wired_local_hub
    uart_id: hayward_uart
    profile: hayward_aqualogic_wired_local
    wired_sub_type: 0x04

  # Jandy AllButton emulator — profile injects gate frame [0x08, 0x00] (AllButton probe)
  # and sum8 header-inclusive CRC. Requires idle_command (enforced by validate_hub).
  - id: jandy_hub
    uart_id: jandy_uart
    profile: jandy_aqualink_rs
    tx:
      idle_command: 0x00

  # Jandy in sniffer mode — exempted from the idle_command requirement.
  - id: jandy_sniffer_hub
    uart_id: jandy_uart
    profile: jandy_aqualink_rs
    sniffer_only: true

  # Generic profile bypasses final_validate UART enforcement so 38400 7E1 is accepted.
  # Also exercises sniffer_stats: without an explicit reference_frame_type to confirm the
  # default-to-gate fallback in to_code is reached during config-only validation.
  # No key_format set: validates that generic hubs omit key_format from defaults (so the
  # button platform's final_validate can detect "command: against a generic hub" cleanly).
  - id: generic_hub
    uart_id: generic_uart
    profile: generic_rs485_frame
    crc:
      type: none
    tx:
      gate:
        mode: idle_gap
    sniffer_stats: {}

  # Generic profile with an explicit key_format: validates that command:-form buttons are
  # still accepted against generic hubs when the user opts in by setting key_format.
  - id: generic_hub_with_key_format
    uart_id: generic_uart
    profile: generic_rs485_frame
    key_format: jandy_allbutton
    crc:
      type: sum8
    tx:
      gate:
        mode: idle_gap

# Buttons exercise the new mutually-exclusive command vs frame_type+payload validation.
# All branches of _validate_button + _final_validate are reached:
#   - command-form against a profile that supplies key_format (hayward_wireless_hub)
#   - raw form against a generic hub with no key_format (generic_hub)
#   - command-form against a generic hub with explicit key_format (generic_hub_with_key_format)
button:
  - platform: rs485_frame
    rs485_frame_id: hayward_wireless_hub
    name: "Validate Lights"
    command: 0x00010000

  - platform: rs485_frame
    rs485_frame_id: generic_hub
    name: "Validate Raw"
    frame_type: [0x00, 0xA1]
    payload: [0x01, 0x02, 0x03, 0x04]

  - platform: rs485_frame
    rs485_frame_id: generic_hub_with_key_format
    name: "Validate Command Override"
    command: 0x00000001
