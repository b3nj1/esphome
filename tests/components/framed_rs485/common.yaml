globals:
  - id: g_led_mask
    type: uint32_t
    initial_value: "0"
  - id: g_display_text
    type: std::string
    initial_value: '""'

framed_rs485:
  # Hub 1 — exercises on_frame: triggers + diagnostic sensors + button + number.
  # generic_framed_rs485 profile skips UART enforcement so the shared 9600 8N1 UART works.
  - id: framed_rs485_hub
    uart_id: uart_bus
    profile: generic_framed_rs485
    dump_frames: true
    frame_timeout: 50ms
    on_frame:
      # Decode a 32-bit little-endian bitmask once; push to multiple template sensors.
      - frame_type: [0x01, 0x02]
        then:
          - lambda: |-
              if (payload.size() < 6) return;
              uint32_t mask = uint32_t(payload[2]) | (uint32_t(payload[3]) << 8) |
                              (uint32_t(payload[4]) << 16) | (uint32_t(payload[5]) << 24);
              id(g_led_mask) = mask;
              id(led_bit0).publish_state(bool(mask & (1UL << 0)));
              id(led_bit1).publish_state(bool(mask & (1UL << 1)));
      # Display text decode into a stack buffer then a single std::string at publish time.
      - frame_type: [0x01, 0x03]
        then:
          - lambda: |-
              char out[32] = {};
              uint8_t olen = 0;
              for (size_t i = 3; i < payload.size() && olen < sizeof(out) - 1; i++) {
                uint8_t b = payload[i] & 0x7F;  // strip blink bit
                if (b >= 0x20 && b < 0x7F)
                  out[olen++] = char(b);
              }
              id(display_text).publish_state(std::string(out, olen));
      # Match-every-frame: write the first byte to a global for diagnostics.
      - frame_type: []
        then:
          - lambda: |-
              if (!payload.empty())
                id(g_led_mask) = payload[0];

  # Hub 2 — sniffer-only with idle_gap gate and CRC16-Modbus. Exercises a different
  # crc_type, gate mode, queue policy, and the FIFO-with-larger-queue path.
  - id: framed_rs485_hub2
    uart_id: uart_bus
    profile: generic_framed_rs485
    sniffer_only: true
    crc:
      type: crc16_modbus
      rx_accept: [header_inclusive, payload_only]
      tx_variant: header_inclusive
    tx:
      gate:
        mode: idle_gap
        min_silence: 10ms
      queue_policy: fifo
      max_queue_size: 4

  # Hub 3 — fixed_delay gate with XOR8 CRC and an idle_command set.
  - id: framed_rs485_hub3
    uart_id: uart_bus
    profile: generic_framed_rs485
    crc:
      type: xor8
    tx:
      gate:
        mode: fixed_delay
        interval: 500ms
      idle_command: 0x00

binary_sensor:
  # User RX decoding is done entirely through on_frame: + template sensors.
  - platform: template
    id: led_bit0
    name: "LED Bit 0"

  - platform: template
    id: led_bit1
    name: "LED Bit 1"

text_sensor:
  # User text decoding via on_frame: + template text_sensor.
  - platform: template
    id: display_text
    name: "Display Text"

  # Diagnostic: most recent validated frame type as 4-hex string.
  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "Last Frame Type"

sensor:
  # Diagnostic counters. publish_state deduplicates so steady-state buses don't spam.
  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "Frames Received"
    decode: frames_received

  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "CRC Failures"
    decode: crc_failures

  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "Commands Sent"
    decode: commands_sent

  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "Command Drops"
    decode: command_drops

  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "Last Keepalive ms"
    decode: last_keepalive_ms

  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "Queue Depth"
    decode: queue_depth

button:
  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "Lights Toggle"
    command: 0x00010000

number:
  - platform: framed_rs485
    framed_rs485_id: framed_rs485_hub
    name: "VSP Speed"
    min_value: 0
    max_value: 100
    step: 1
    lambda: |-
      return std::vector<uint8_t>{0x0c, 0x01, 0x00, static_cast<uint8_t>(x)};
